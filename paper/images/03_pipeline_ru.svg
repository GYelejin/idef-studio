<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="270" fill="#ffffff"/>

  <!-- Step 1: IDEF0 Diagram -->
  <rect x="16" y="60" width="130" height="76" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
  <text x="81" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Диаграмма IDEF0</text>
  <text x="81" y="110" text-anchor="middle" font-size="11" fill="#222222">Блоки и ICOM</text>
  <text x="81" y="125" text-anchor="middle" font-size="11" fill="#222222">+ проверка границ</text>

  <!-- Step 2: Post-Order Tree -->
  <rect x="176" y="60" width="130" height="76" rx="4" fill="#f5f5f5" stroke="#000000" stroke-width="1.4"/>
  <text x="241" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Обход дерева</text>
  <text x="241" y="110" text-anchor="middle" font-size="11" fill="#222222">Сначала листья,</text>
  <text x="241" y="125" text-anchor="middle" font-size="11" fill="#222222">затем корень</text>

  <!-- Step 3: Generator Agent -->
  <rect x="336" y="60" width="142" height="76" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="407" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Агент-генератор</text>
  <text x="407" y="106" text-anchor="middle" font-size="11" fill="#222222">Языковая модель</text>
  <text x="407" y="122" text-anchor="middle" font-size="11" fill="#222222">(общий диалог)</text>

  <!-- Step 4: Structural Filter -->
  <rect x="508" y="60" width="128" height="76" rx="4" fill="#f5f5f5" stroke="#000000" stroke-width="1.4"/>
  <text x="572" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Фильтр структуры</text>
  <text x="572" y="110" text-anchor="middle" font-size="11" fill="#222222">Имя, return,</text>
  <text x="572" y="125" text-anchor="middle" font-size="11" fill="#222222">дочерние вызовы</text>

  <!-- Step 5: Verifier Agent -->
  <rect x="666" y="60" width="138" height="76" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="735" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Агент-верификатор</text>
  <text x="735" y="106" text-anchor="middle" font-size="11" fill="#222222">Языковая модель</text>
  <text x="735" y="122" text-anchor="middle" font-size="11" fill="#222222">(без истории чата)</text>

  <!-- Forward arrows -->
  <line x1="146" y1="98" x2="174" y2="98" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="306" y1="98" x2="334" y2="98" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="478" y1="98" x2="506" y2="98" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="636" y1="98" x2="664" y2="98" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Repair Loop -->
  <path d="M 735 136 L 735 186 L 407 186 L 407 139" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M 572 136 L 572 186" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5,4"/>
  <rect x="462" y="173" width="222" height="24" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="573" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">passed = false: Исправление (до 3)</text>

  <!-- Output Box -->
  <rect x="626" y="212" width="178" height="44" rx="4" fill="#f5f5f5" stroke="#000000" stroke-width="1.8"/>
  <text x="715" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">passed = true: Python</text>
  <text x="715" y="248" text-anchor="middle" font-size="11" fill="#222222">Добавлена в программу</text>

  <path d="M 760 136 L 760 210" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="783" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#000000">true</text>

  <!-- Title Bar -->
  <text x="410" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Двухагентная схема генерации и проверки кода</text>
</svg>

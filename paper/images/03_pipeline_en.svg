<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="270" fill="#ffffff"/>

  <!-- Step 1: IDEF0 Diagram -->
  <rect x="16" y="60" width="130" height="76" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="81" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">IDEF0 Diagram</text>
  <text x="81" y="110" text-anchor="middle" font-size="11" fill="#334155">Blocks &amp; ICOM</text>
  <text x="81" y="125" text-anchor="middle" font-size="11" fill="#334155">+ Live Linter</text>

  <!-- Step 2: Post-Order Tree -->
  <rect x="176" y="60" width="130" height="76" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="241" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Post-Order</text>
  <text x="241" y="110" text-anchor="middle" font-size="11" fill="#334155">Leaves first,</text>
  <text x="241" y="125" text-anchor="middle" font-size="11" fill="#334155">Root block last</text>

  <!-- Step 3: Generator Agent -->
  <rect x="336" y="60" width="142" height="76" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="407" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">Generator Agent</text>
  <text x="407" y="106" text-anchor="middle" font-size="11" fill="#065f46">Model: korolev-k5</text>
  <text x="407" y="122" text-anchor="middle" font-size="11" fill="#065f46">(Stateful chat)</text>

  <!-- Step 4: Structural Filter -->
  <rect x="508" y="60" width="128" height="76" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="1.6"/>
  <text x="572" y="91" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">Structural Filter</text>
  <text x="572" y="110" text-anchor="middle" font-size="11" fill="#854d0e">Signature, return,</text>
  <text x="572" y="125" text-anchor="middle" font-size="11" fill="#854d0e">child calls check</text>

  <!-- Step 5: Verifier Agent -->
  <rect x="666" y="60" width="138" height="76" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="735" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">Verifier Agent</text>
  <text x="735" y="106" text-anchor="middle" font-size="11" fill="#991b1b">Model: korolev-k5</text>
  <text x="735" y="122" text-anchor="middle" font-size="11" fill="#991b1b">(Isolated, no history)</text>

  <!-- Forward arrows -->
  <line x1="146" y1="98" x2="174" y2="98" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="306" y1="98" x2="334" y2="98" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="478" y1="98" x2="506" y2="98" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="636" y1="98" x2="664" y2="98" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Repair Loop -->
  <path d="M 735 136 L 735 186 L 407 186 L 407 139" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <path d="M 572 136 L 572 186" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5,4"/>
  <rect x="488" y="173" width="170" height="24" rx="4" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
  <text x="573" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">FAIL: Repair (max 3 passes)</text>

  <!-- Output Box -->
  <rect x="640" y="212" width="164" height="44" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/>
  <text x="722" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">PASS: Python Module</text>
  <text x="722" y="248" text-anchor="middle" font-size="11" fill="#166534">Added to final program</text>

  <path d="M 760 136 L 760 210" fill="none" stroke="#15803d" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="783" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">PASS</text>

  <!-- Title Bar -->
  <text x="410" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Two-Agent Code Generation and Verification Pipeline (Single Base LLM)</text>
</svg>
